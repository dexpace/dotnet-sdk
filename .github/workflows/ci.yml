name: CI

# Every gate of design §9 that has a subject today, blocking on every pull request (roadmap phase 0, tasks 2-3).
# Target framework: net10.0 only (roadmap decision D1), so each job needs just the SDK global.json pins, which
# carries the .NET 10 runtime the tests run on.
#
# Wired in the build itself (TreatWarningsAsErrors turns each into an error): analyzers and code style
# (AnalysisLevel, EnforceCodeStyleInBuild, .editorconfig), IDE0073 license headers (NFR-13), MA0051 method length,
# RS0016/RS0017 public-API files (NFR-4), RS0030 banned APIs (design §9.1), trim/AOT analyzers on every library
# (NFR-8), NuGet audit, and package validation during `dotnet pack` (EnablePackageValidation).
#
# Tests run on xUnit v3 over Microsoft.Testing.Platform: global.json's "test.runner" puts `dotnet test` in the
# platform's mode, so its options are the platform's (--solution, --report-trx, --coverlet), not VSTest's. Every
# test carries a [Trait("Category", ...)] of design §9.3 (Unit, Integration, Conformance, AotSmoke, Security), which
# each suite's TestCategoryTests enforces; the default run executes them all. SEAM-2's partition (core's suite never
# references a transport) is an architecture test in tests/Dexpace.Sdk.Core.Tests/Architecture/.
#
# Transport conformance kit (Dexpace.Sdk.Conformance, phase 8a): on. Two drivers run in the default test step, the reference
# transport (tests/Dexpace.Sdk.Http.SystemNet.Tests/SystemNetConformanceTests.cs, whose Owner = "8b" waivers phase 8b deletes
# as it closes their rows) and a test-only raw-socket client reached through DelegateHttpClient
# (tests/Dexpace.Sdk.Conformance.Tests/Drivers/); both carry [Trait("Category", "Conformance")] and run on every OS row. Phase 9 adds a
# third, over the transport AddDexpaceClient builds from IHttpClientFactory
# (tests/Dexpace.Sdk.Extensions.DependencyInjection.Tests/Conformance/), which needs no CI step of its own: it runs in the solution's
# test step and its coverage report is picked up by name. The kit is a measured library of the coverage gate, and a slice of it runs
# in the NativeAOT smoke consumer, which also exercises the DI package (phase 9).
#
# Gates wired but inert until their subject exists, and the phase that turns each on:
#   - SSE-37 architecture test (serde independence of SSE and paging): wired in
#     tests/Dexpace.Sdk.Core.Tests/Architecture/Sse37ArchitectureTests.cs, and reported as skipped until the
#     Dexpace.Sdk.Core.ServerSentEvents namespace holds a type; phase 7 lands it, and the test enforces with no edit.
#   - Package-validation baseline (PackageValidationBaselineVersion): phase 12, at the first published version.
#   - Strong naming and author signing (NFR-16): phase 12.
#
# Phase 10 completed what was inert: the NativeAOT smoke consumer below runs the invariant suite with core's defaults and the codec suite over the
# System.Text.Json adapter (tests/Dexpace.Sdk.AotSmoke/SmokeChecks.Phase10.cs); NFR-11's public-signature type scan is
# tests/Dexpace.Sdk.Core.Tests/Architecture/Nfr11PublicSurfaceArchitectureTests.cs; the packaging suite runs after Pack (below); and
# tests/Dexpace.Sdk.Conformance.Tests/Gates/CiWorkflowTests.cs fails if a gate here is dropped or made advisory (NFR-17).
# The requirement-coverage check (scripts/ci/requirement-coverage.cs --check, with its self-test) blocks every pull request on the Linux row.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  build:
    name: build & test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    # A hung test host otherwise holds the runner for GitHub's six-hour default (seen on Windows in phase 8a); a full run takes
    # well under ten minutes on every OS row.
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      # Every project commits a packages.lock.json; a graph that moved without a reviewed lock-file diff fails here.
      - name: Restore (locked)
        run: dotnet restore Dexpace.Sdk.sln --locked-mode

      # TreatWarningsAsErrors + the analyzer set make the build itself the lint gate (NFR-6, NFR-7).
      - name: Build
        run: dotnet build Dexpace.Sdk.sln --configuration Release --no-restore

      - name: Format
        run: dotnet format Dexpace.Sdk.sln --verify-no-changes --no-restore

      # coverlet.MTP writes one Cobertura report per test project into the results directory. Its own name is a
      # millisecond timestamp two test hosts can share, so Directory.Build.targets prefixes every test project's
      # report with the project name (<TestProject>.coverage.cobertura.<timestamp>.xml); no report can overwrite
      # another's, and a new test project needs no edit here (issue #33).
      #
      # The hang dump (Microsoft.Testing.Extensions.HangDump, in every test project): a test host in which no test has finished
      # for five minutes (the timer restarts at every finished test; the kit's longest bound on one assertion is 30 s) is dumped
      # into the results directory, which the upload step below keeps, and killed, so the step fails naming the project instead
      # of running into the job timeout. A host frozen inside the runtime (phase 8a's Windows hang: a thrown cyclic exception,
      # see tests/Dexpace.Sdk.TestSupport/Recovery/CyclicExceptions.cs) cannot answer the extension's in-progress-tests query,
      # so the dump's thread stacks name the test: `dotnet-dump analyze <dump> -c "clrstack -all"`.
      - name: Test
        run: >-
          dotnet test --solution Dexpace.Sdk.sln --configuration Release --no-build
          --results-directory artifacts/test-results
          --report-trx
          --coverlet --coverlet-output-format cobertura
          --hangdump --hangdump-timeout 5m --hangdump-type Mini

      # NFR-5: aggregate line coverage over the src/ assemblies, merged across every test project. Measured at
      # 88.38% when the gate was wired, so the floor is the design's 80% from the start. It fails closed (exit 3)
      # when a test project under tests/ left no report or a library under src/ has no coverage data in any.
      - name: Coverage floor
        run: dotnet run scripts/ci/coverage-gate.cs -- artifacts/test-results 80

      # The gate's own regression check, over altered copies of this run's reports: one report missing, a library
      # unmeasured, the floor above the measurement, and an empty directory must each fail with their exit code.
      - name: Coverage floor - self-test
        run: scripts/ci/coverage-gate-selftest.sh artifacts/test-results

      # EnablePackageValidation runs inside pack for every library (Directory.Build.props).
      - name: Pack
        run: dotnet pack Dexpace.Sdk.sln --configuration Release --no-build --output artifacts/packages

      # SEAM-1/NFR-1/NFR-2 (roadmap constraint 2): each library's deps.json closure and nuspec dependency groups.
      - name: Dependency audit
        run: dotnet run scripts/ci/dependency-audit.cs -- Release artifacts/packages

      # The audit's own regression check (phase 11, task 1.3): core's allowance is the fixed set {facade, DependencyInjection.Abstractions}, so a
      # package injected under the facade, under its dependency, or with no edge at all must fail it, naming the package.
      - name: Dependency audit - self-test
        run: scripts/ci/dependency-audit-selftest.sh artifacts/packages

      # NFR-1/-2/-3/-8/-9/-10/-13/-14/-15 (phase 10, P10-10): the kit's PackagingSuite over the packed .nupkg files: the published metadata (nuspec
      # dependencies, license, versions) and each packed assembly's attributes (IsTrimmable, IsAotCompatible, InternalsVisibleTo, the version),
      # read without loading them. The audit above reads the build output's closure; this reads what was published (two checks, two subjects).
      - name: Packaging conformance
        run: dotnet run scripts/ci/packaging-conformance.cs -- artifacts/packages

      # NFR-16/NFR-12 (phase 12, P12-4): the release preflight over the packed set, here as a dry run (no tag): the five packages at one version, a
      # .snupkg beside each, every packed assembly strong-named with the committed key's token. The tag-dependent findings (a settled
      # PublicAPI.Unshipped.txt, a CHANGELOG.md section, the tag on main) print `would fail:` and do not fail a pull request; release.yml runs it with --tag.
      - name: Release preflight
        run: dotnet run scripts/ci/release-preflight.cs -- artifacts/packages

      # The preflight's own regression check: a missing package or symbol package, a second version, a wrong key token, a wrong or off-main tag, a
      # missing CHANGELOG.md section and an unsettled PublicAPI.Unshipped.txt must each fail it, naming the cause; without a tag the last two only warn.
      - name: Release preflight - self-test
        run: scripts/ci/release-preflight-selftest.sh artifacts/packages

      - name: Tools - restore (locked)
        run: dotnet restore tools/Dexpace.Tools.sln --locked-mode

      - name: Tools - build
        run: dotnet build tools/Dexpace.Tools.sln --configuration Release --no-restore

      - name: Tools - format
        run: dotnet format tools/Dexpace.Tools.sln --verify-no-changes --no-restore

      - name: Tools - test
        run: dotnet test --solution tools/Dexpace.Tools.sln --configuration Release --no-build

      # Blocking (phase 12, P12-18). Every ```csharp fence of README.md, docs/sdk-documentation/*.md and src/*/README.md that names
      # Dexpace.Sdk is compiled against the Release libraries built above, warnings as errors; ```csharp fragment is counted, never
      # compiled. The generated projects live outside the checkout, so one row suffices (it needs the Linux build's Release output).
      - name: Doc fences
        if: runner.os == 'Linux'
        run: dotnet run --project .claude/skills/housekeeping/src -- fences

      # Blocking. A structural check over committed files, so one row suffices; the tool's own tests run on all
      # three above.
      - name: Knowledge corpus structure
        if: runner.os == 'Linux'
        run: scripts/knowledge verify-structure

      # Blocking. Every ID of appendix C is owned by a checklist row under docs/work/ with its level and a legend mark (roadmap phase 10 exit); a
      # structural check over committed files, so one row suffices. The self-test first proves the check fails on each kind of finding.
      - name: Requirement coverage self-test
        if: runner.os == 'Linux'
        run: scripts/ci/requirement-coverage-selftest.sh

      - name: Requirement coverage
        if: runner.os == 'Linux'
        run: dotnet run scripts/ci/requirement-coverage.cs -- --check

      # Blocking. Design section 12's coverage table (the satisfied, vacuous, not-satisfied and deferred IDs of every prefix) is generated from the
      # checklists' resolved marks, not typed (roadmap phase 11, P11-21): a checklist change that moves an ID between the sets fails here until
      # section 12's last generated table is regenerated with `--section12`.
      - name: Section 12
        if: runner.os == 'Linux'
        run: dotnet run scripts/ci/requirement-coverage.cs -- --check-section12

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.os }}
          path: artifacts/test-results/

  reproducible:
    name: reproducible packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      # NFR-12's build half: two packs of HEAD from two checkouts at different paths (git worktrees, phase 10, P10-14), with
      # SOURCE_DATE_EPOCH at the commit time, must be byte-identical, so a path leaking into an artefact fails the job. The release
      # half (a published artifact rebuilt from its tag) is phase 12's. The script writes a job-local global.json with "rollForward": "disable"
      # into each checkout and prints `dotnet --version` from inside it, failing when it is not the SDK global.json pins (phase 11, task 1.1):
      # setup-dotnet installs that SDK, but the runner image may carry a newer patch that "latestPatch" would pick.
      - name: Pack twice and compare
        run: scripts/ci/reproducible-pack.sh artifacts/reproducible

      # The compare's own regression check: a copy of one pack with one byte flipped must fail it, naming the package, and a toolchain other
      # than the pinned one must be refused.
      - name: Pack twice and compare - self-test
        run: scripts/ci/reproducible-pack.sh --self-test artifacts/reproducible-selftest

  aot-smoke:
    name: NativeAOT smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      # The NativeAOT toolchain's native prerequisites on Linux.
      - name: Install clang and zlib
        run: sudo apt-get update && sudo apt-get install --yes clang zlib1g-dev

      - name: Restore (locked)
        run: dotnet restore Dexpace.Sdk.sln --locked-mode

      # NFR-9: publish with PublishAot (set in the project), trim and AOT warnings as errors, then run the binary.
      - name: Publish
        run: >-
          dotnet publish tests/Dexpace.Sdk.AotSmoke/Dexpace.Sdk.AotSmoke.csproj
          --configuration Release --no-restore --output artifacts/aot-smoke

      - name: Run
        run: ./artifacts/aot-smoke/Dexpace.Sdk.AotSmoke
